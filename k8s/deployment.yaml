apiVersion: apps/v1
kind: Deployment
metadata:
  name: meow-ops-deployment
  labels:
    app: meow-ops-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meow-ops-app
  template:
    metadata:
      labels:
        app: meow-ops-app
    spec:
      containers:
      - name: meow
        image: lauracode/meow-ops:25586d965bac4a3802db732efc01101d7b41e2ce
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 500m
            memory: 64Mi
          requests:
            cpu: 200m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
          - name: condessa-status
            mountPath: /usr/share/nginx/html/status
            readOnly: true
      volumes:
        - name: condessa-status
          configMap:
            name: condessa-status